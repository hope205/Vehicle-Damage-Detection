# YOLO segmentation model checkpoint
model_name: yolo26m.pt

num_classes: 3

class_names:
  - dent
  - scratch
  - clean

model_path: src/app/model/new_carrd.pt


# Image size used during inference
image_size: 640

allowed_content_types:
  - image/jpeg
  - image/png
  - image/jpg
  - image/webp

confidence_threshold: 0.4  # Confidence threshold for predictions
iou_threshold: 0.7  # Intersection over Union threshold for predictions