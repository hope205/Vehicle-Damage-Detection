[project]
name = "vehicle-damage-detection"
version = "0.1.0"
description = "Vehicle damage detection API (dents and scratches)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.8",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.4.107",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Force CPU wheels for Docker / Windows inference (no NVIDIA CUDA packages).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
